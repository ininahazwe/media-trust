name: Deploy Dashboard to cPanel

# Build et déploie mti-dashboard/ (React + Vite) sur le serveur cPanel,
# dans le dossier "dashboard/" du sous-domaine index-media.mfwa.org
# (https://index-media.mfwa.org/dashboard/), dès qu'un push sur main
# modifie ce dossier (ou à la demande via l'onglet "Actions").
#
# Secrets requis en plus de ceux de deploy-backend.yml :
#   CPANEL_DASHBOARD_REMOTE_PATH  chemin absolu du dossier dashboard sur
#                                 le serveur (ex: /home/dxtrmfwa/public_html/index-media.mfwa.org/dashboard)
#
# Ne touche jamais à .htaccess ni .env déjà présents sur le serveur dans
# ce dossier (routing SPA et config, gérés à la main).

on:
  push:
    branches: [main]
    paths:
      - "mti-dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mti-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mti-dashboard/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build (utilise .env.production pour VITE_API_URL)
        run: npm run build

      - name: Sync dist/ vers cPanel via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=.htaccess
            --exclude=.env
          path: mti-dashboard/dist/
          remote_path: ${{ secrets.CPANEL_DASHBOARD_REMOTE_PATH }}
          remote_host: ${{ secrets.CPANEL_SSH_HOST }}
          remote_port: ${{ secrets.CPANEL_SSH_PORT }}
          remote_user: ${{ secrets.CPANEL_SSH_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
